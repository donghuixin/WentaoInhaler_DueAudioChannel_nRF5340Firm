# Temporary diagnostic fragment for testing ADAU1860 I2C/audio initialization.
# Keeps original fuel-gauge and audio setup, but forces power_on so boot reaches
# audio_system_init() even when charger/wake state would otherwise wait.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_RTT_BUFFER=0
CONFIG_LOG_BACKEND_RTT_OUTPUT_BUFFER_SIZE=1024
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MODULE_POWER_LOG_LEVEL_INF=y
CONFIG_AUDIO_SYSTEM_LOG_LEVEL_DBG=y
CONFIG_MODULE_HW_CODEC_LOG_LEVEL_DBG=y
CONFIG_OPENEARABLE_ADAU_I2C_TEST_FORCE_POWER_ON=y
CONFIG_OPENEARABLE_ADAU_I2C_TEST_SKIP_FUEL_GAUGE_SETUP=y
