# Temporary debug fragment for reading startup/BLE logs over SEGGER RTT.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=n
CONFIG_LOG_BACKEND_RTT_OUTPUT_BUFFER_SIZE=512
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BT_MGMT_LOG_LEVEL_INF=y
CONFIG_BT_MGMT_ADV_LOG_LEVEL_INF=y
CONFIG_BT_MGMT_SCAN_LOG_LEVEL_INF=y
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_INF=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_INF=y
CONFIG_IPC_SERVICE_LOG_LEVEL_INF=y
CONFIG_STREAMCTRL_LOG_LEVEL_INF=y
CONFIG_MODULE_POWER_LOG_LEVEL_INF=y
