# Temporary diagnostic fragment for validating the non-wake hardware chain.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_RTT_BUFFER=0
CONFIG_LOG_BACKEND_RTT_OUTPUT_BUFFER_SIZE=1024
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MAIN_LOG_LEVEL_INF=y

# Bypass only the unavailable wake button path.
CONFIG_OPENEARABLE_ADAU_I2C_TEST_FORCE_POWER_ON=y

# Keep the BQ27220 path normal: read battery data, but do not force reprogramming.
CONFIG_OPENEARABLE_ADAU_I2C_TEST_SKIP_FUEL_GAUGE_SETUP=n
CONFIG_OPENEARABLE_BQ27220_FORCE_SETUP_ON_BOOT=n

# The current board has no ADAU1860 audio module populated.
CONFIG_OPENEARABLE_SKIP_AUDIO_HW=y
