<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenEarable BLE Collector</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app layout">
      <aside class="sidebar">
        <h2>Bluetooth</h2>
        <div class="status-block">
          <div><span>Link:</span><strong id="linkState">Disconnected</strong></div>
          <div><span>Device:</span><strong id="deviceName">No device</strong></div>
          <div class="battery-row">
            <span>Battery:</span>
            <strong id="batteryLevel">--</strong>
            <button id="refreshBatteryBtn" type="button" disabled>Refresh</button>
          </div>
        </div>
        <div class="controls-col">
          <button id="connectNamedBtn" class="primary" type="button">Connect OpenEarable</button>
          <button id="connectAnyBtn" type="button">Connect Any BLE</button>
          <button id="disconnectBtn" class="danger" type="button" disabled>Disconnect</button>
        </div>
      </aside>

      <section class="content">
      <header class="toolbar">
        <h1>BLE Multimodal Collector</h1>
        <div class="controls">
          <label for="filePrefix">File Prefix</label>
          <input id="filePrefix" type="text" value="ble_data" />
          <button id="startBtn" class="primary" type="button">Start</button>
          <button id="stopBtn" class="danger" type="button" disabled>Stop</button>
          <button id="saveBtn" type="button" disabled>Save</button>
        </div>
        <p id="statusText">Idle</p>
      </header>

      <section class="grid">
        <article class="panel">
          <div class="panel-head">
            <h2>Thermal IR Preview</h2>
            <span id="thermalInfo">No frame</span>
          </div>
          <canvas id="thermalCanvas" width="384" height="288"></canvas>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>IMU Preview</h2>
            <span id="imuInfo">No sample</span>
          </div>
          <canvas id="imuCanvas" width="420" height="180"></canvas>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Audio Preview</h2>
            <span id="audioInfo">No packet</span>
          </div>
          <canvas id="audioCanvas" width="420" height="180"></canvas>
        </article>
      </section>

      <pre id="log"></pre>
      </section>
    </main>
    <script src="app.js?v=20260609-minimal" type="module"></script>
  </body>
</html>
